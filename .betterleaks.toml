# Betterleaks rules for this repository (#124), run by scripts/scan-commits.sh
# over commit diffs and commit messages: by the ci job over the whole history,
# at the version pinned there, and by the pre-push hook over the commits being
# pushed, with the betterleaks on PATH (#167). By hand:
# bash scripts/scan-commits.sh betterleaks HEAD
#
# They enforce the rule in CLAUDE.md: the repository is public and holds no
# environment URLs or tenant and client IDs. Token formats are left to GitHub
# secret scanning, so the default Betterleaks rules are not loaded.
#
# This file is public too. Never put a real environment host or ID here, not
# even on an allowlist: rewrite the commit instead.
title = "dataverse-mcp-server"

# A Dataverse / Dynamics 365 environment host: <org>[.api].crm[N].dynamics.com,
# and the sovereign clouds: crm.dynamics.cn (China), crm.microsoftdynamics.us
# (GCC High), crm.microsoftdynamics.de (former Germany cloud),
# crm.appsplatform.us (DoD). GCC is crm9.dynamics.com. Power Platform
# environment IDs (make.powerapps.com/environments/<id>, the admin center,
# <id>.environment.api.powerplatform.com) are not covered.
[[rules]]
id = "dataverse-environment-host"
description = "Dataverse environment host"
# The host is group 1: it may follow or precede any character but a letter
# or digit, `_` included (DEV_<org>.crm4..., ...dynamics.com_old), where \b
# would not match. Every host
# suffix in the regex needs a keyword, or the rule never runs on it.
regex = '''(?i)(?:^|[^a-z0-9])((?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+crm[0-9]{0,2}\.(?:dynamics\.com|dynamics\.cn|microsoftdynamics\.us|microsoftdynamics\.de|appsplatform\.us))(?:[^a-z0-9-]|$)'''
secretGroup = 1
keywords = ["dynamics.com", "dynamics.cn", "microsoftdynamics", "appsplatform"]
# Allowed: the placeholder hosts of the tests and docs, and Microsoft's shared
# discovery endpoints. Exact hosts only; a new placeholder goes on this list.
filter = '''
lower(finding["secret"]) in [
  "org.crm.dynamics.com",
  "your-org.crm.dynamics.com",
  "globaldisco.crm.dynamics.com",
  "disco.crm.dynamics.com"
]
'''

# A tenant or client ID. A bare GUID cannot be told apart from the record and
# metadata IDs this code and its tests are full of, so the rule only looks at
# a GUID after a tenant/client/app/object/directory ID name and `:` or `=`
# (env files, JSON, YAML; the name may run on, as in CLIENT_ID_PROD, and the
# GUID may be in braces), or in an Entra authority URL of any cloud. It
# misses an ID under another name, such as `const TENANT = "..."`, after a
# command-line flag, such as `--tenant <guid>`, or under a token claim name
# (tid, azp, oid) in a decoded token. Placeholders built from repeated digit
# blocks (00000000-0000-..., 11111111-2222-3333-...) have low entropy and are
# skipped; `12345678-1234-...` does not, and is flagged. Every authority host
# in the regex needs a keyword.
[[rules]]
id = "entra-tenant-or-client-id"
description = "Tenant or client ID"
regex = '''(?i)(?:(?:tenant|client|app|application|object|directory)[_ .-]?id[\w"']{0,12}\s*[:=]\s*["'`]?\{?|login\.microsoft\.com/|login\.microsoftonline\.(?:com|us|de)/|login\.partner\.microsoftonline\.cn/|login\.chinacloudapi\.cn/|login\.windows\.net/|sts\.windows\.net/)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
keywords = ["tenant", "client", "app", "object", "directory", "login.microsoft.com", "microsoftonline", "chinacloudapi", "windows.net"]
filter = '''filter.entropy(replace(finding["secret"], "-", "")) < 3.0'''
