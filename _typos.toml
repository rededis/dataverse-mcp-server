# typos (#127), run by the ci job at the version pinned there. Locally, the
# typos-cli release of that version (cargo install typos-cli --version X.Y.Z,
# or a binary from the GitHub release), then: typos
[files]
# By default typos skips hidden files, and with them .github/ and .husky/.
# Checking them walks .git/ too: exclude it, and the IDE's .idea/.
ignore-hidden = false
extend-exclude = [".git/", ".idea/"]
