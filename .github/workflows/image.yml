name: Image

# Builds the server image for one platform and starts it (#139), so a pull
# request that changes what goes into the image is tested before merge:
# Dependabot's base image digests and docker/* action updates in particular.
# Multi-platform builds and publishing stay in server-release.yml. Not a
# required check: with the paths filter it does not run on every PR.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.json
      - LICENSE
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

# A new push to the PR makes the running check obsolete.
concurrency:
  group: image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: image-check
      VERSION: 0.0.0-ci

    steps:
      # Actions are pinned by full commit SHA, the tag in a comment; the same
      # pins as server-release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: SERVER_VERSION=${{ env.VERSION }}
          provenance: false

      - name: The image starts and reports its version
        uses: ./.github/actions/check-image
        with:
          image: ${{ env.IMAGE }}
          version: ${{ env.VERSION }}
