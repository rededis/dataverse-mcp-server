name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only v* tags: server-v* is the image's line (server-release.yml,
    # ADR-0001 §13).
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # No audit gate here, unlike server-release.yml: the package ships no
      # lockfile, so users install whatever the ranges in package.json resolve
      # to, and the lockfile's advisories say little about that.
      - run: npm ci --no-audit --no-fund

      - name: Verify package.json version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (-> ${TAG}) does not match package.json version (${PKG})"
            exit 1
          fi

      - name: Verify CHANGELOG has entry for this version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if ! grep -Fq "## [${PKG}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a '## [${PKG}]' section"
            exit 1
          fi

      # Leaves dist/ in place for npm publish.
      - name: Check
        run: npm run check

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
