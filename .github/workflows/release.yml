name: Release

on:
  release:
    types: [published]

# Each job asks for what it needs.
permissions: {}

# A second run for the same tag waits: a running release is not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (ADR-0003 on main)

    steps:
      # Actions are pinned by full commit SHA: the repository requires it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No npm cache: a poisoned cache entry would end up in what is published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --no-audit --no-fund

      - name: Verify package.json version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (-> ${TAG}) does not match package.json version (${PKG})"
            exit 1
          fi

      - name: Verify CHANGELOG has entry for this version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if ! grep -Fq "## [${PKG}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a '## [${PKG}]' section"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Trusted publishing: npm exchanges the job's OIDC token, no secret.
      # npmjs.com trusts this file by name: renaming it breaks publishing.
      # Provenance is added on its own; access comes from publishConfig.
      - name: Publish to npm
        run: npm publish
