name: Release

on:
  release:
    types: [published]

# Each job asks for what it needs.
permissions: {}

# A second run for the same tag waits: a running release is not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    # Only v* tags: server-v* is the image's line (server-release.yml,
    # ADR-0001 §13). publish needs this job, so it is skipped with it.
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No id-token: npm ci and the checks run third-party code, which must not
    # be able to request the token that npm trusted publishing accepts.
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: a poisoned cache entry would end up in what is published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No audit gate here, unlike server-release.yml: the package ships no
      # lockfile, so users install whatever the ranges in package.json resolve
      # to, and the lockfile's advisories say little about that.
      - run: npm ci --no-audit --no-fund

      - name: Verify package.json version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (-> ${TAG}) does not match package.json version (${PKG})"
            exit 1
          fi

      - name: Verify CHANGELOG has entry for this version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if ! grep -Fq "## [${PKG}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a '## [${PKG}]' section"
            exit 1
          fi

      - name: Check
        run: npm run check

      # Packs the dist/ that Check built. --ignore-scripts skips prepare
      # (husky), which adds nothing to the package.
      - name: Pack
        id: pack
        shell: bash # pipefail: a failed npm pack fails the step
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          TARBALL="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/package" | jq -r '.[0].filename')"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      # Only hands the tarball to publish, so it is kept for a day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout and no install: this job runs no code from the repository
    # or its dependencies.
    permissions:
      id-token: write # npm trusted publishing (ADR-0003)

    steps:
      # Node 24 for npm 11.5.1 or later, which trusted publishing needs. No
      # checkout, so there is nothing to cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Fails if the tarball's digest differs from the upload.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package

      # Trusted publishing: npm exchanges the job's OIDC token, no secret.
      # npmjs.com trusts this file by name: renaming it breaks publishing.
      # Access comes from publishConfig in the tarball's package.json.
      # --provenance: fail rather than publish without provenance, which
      # npm otherwise skips silently when generating it fails.
      # --ignore-scripts: publishing a tarball runs no scripts. The flag keeps
      # it so if this step goes back to publishing the folder, whose
      # prepublishOnly would run next to the OIDC token.
      - name: Publish to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/package/$TARBALL" --provenance --ignore-scripts
