name: CI

on:
  pull_request:
    branches: [main, "maint/**"]
  # Commits pushed straight to these branches (docs and ADRs) are checked
  # where they land, not by the next pull request (#164). The check goes on
  # the pushed tip, not on each commit of the push; a finding then fails every
  # later run too, until the history is rewritten. A skip instruction in the
  # tip's message ([skip ci] and its variants, or a skip-checks: true
  # trailer) skips the run, also one a squash merge takes over from the pull
  # request's commits or body. A merged pull request runs again here: only
  # this run sees the commit that lands and its final message.
  push:
    branches: [main, "maint/**"]

# The job runs third-party actions: the token only reads.
permissions:
  contents: read

# A new push to a pull request cancels its older runs, not those of others.
# A push to a branch has no pull request number: it gets a group of its own,
# so a later push does not cancel the check of an earlier commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    # Deleting a maint branch is a push too: the run falls back to the default
    # branch's tip and would report on a commit the push did not touch.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The whole history, for the Betterleaks scan below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same command the pre-commit hook runs (check in package.json).
      - name: Check
        run: npm run check

      # The linters below run even when a step above failed, and each other's
      # failure does not skip them: one red run shows every problem.

      # Spelling in every file git does not ignore, by _typos.toml (#127).
      # The release binary is checked against its sha256 by
      # scripts/fetch-verified.sh, like jactionlint below (ADR-0003, #157).
      # Dependabot does not bump it: change the version and the digest
      # together, from the release asset's sha256 on its GitHub release page,
      # confirmed with gh release verify-asset (ADR-0003). The digest is the
      # PLATFORM archive's: an arm64 runner needs another.
      - name: Spell check
        if: ${{ !cancelled() }}
        env:
          VERSION: 1.52.0
          PLATFORM: x86_64-unknown-linux-musl
          SHA256: 6155d4114f9a0f5b8f6d4fda96266c9d5f6add71df80da7f684ee5e72eb14588
        run: |
          bash scripts/fetch-verified.sh \
            "https://github.com/crate-ci/typos/releases/download/v${VERSION}/typos-v${VERSION}-${PLATFORM}.tar.gz" \
            "$SHA256" ./typos "$RUNNER_TEMP"
          "$RUNNER_TEMP/typos"

      # Hadolint on the Dockerfile (#127), default rules and threshold. The
      # action's SHA pins the Hadolint image: its own Dockerfile names it by
      # tag and digest. The action always passes failure-threshold (default
      # info), which beats one in a .hadolint.yaml: change it under with:.
      - name: Dockerfile lint
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

      # jactionlint on the workflows (#121), default profile, offline. The
      # release binary is checked against its sha256 by
      # scripts/fetch-verified.sh, like typos above, not by an action or image
      # (ADR-0003). Dependabot does not bump it: change the version and the
      # digest together, from the release's checksums file. The digest is the
      # PLATFORM archive's: an arm64 runner needs another.
      - name: Workflow lint
        if: ${{ !cancelled() }}
        env:
          VERSION: 2.5.0
          PLATFORM: linux_amd64
          SHA256: 5ac307b0499bb0eab45ae99c23e8e0790874fbc667c75224410954e0e3c6e0f5
        run: |
          bash scripts/fetch-verified.sh \
            "https://github.com/jdx/jactionlint/releases/download/v${VERSION}/jactionlint_${VERSION}_${PLATFORM}.tar.gz" \
            "$SHA256" jactionlint "$RUNNER_TEMP"
          "$RUNNER_TEMP/jactionlint" --no-online --format github

      # Betterleaks with the project rules in .betterleaks.toml (#124):
      # environment hosts and tenant or client IDs in every commit reachable
      # from the checked-out one, so one added and removed within a pull
      # request still fails, and in their messages. HEAD, not the default
      # --all: a finding on another fetched branch does not fail this one.
      # A merge commit is diffed against its first parent, so a conflict
      # resolution is scanned too. Findings show the file, commit and line,
      # the match itself redacted; a finding in a message is printed under
      # the line `commit <sha>` that precedes it. Both scans run; either
      # fails the step, as does a failing git log.
      # The release binary is checked against its sha256 by
      # scripts/fetch-verified.sh, like typos and jactionlint (ADR-0003).
      # Dependabot does not bump it: change the version and the digest
      # together, from the release's checksums.txt, confirmed with gh release
      # verify-asset (ADR-0003). The digest is the PLATFORM archive's: an
      # arm64 runner needs another.
      - name: Environment host and tenant ID scan
        if: ${{ !cancelled() }}
        env:
          VERSION: 1.10.0
          PLATFORM: linux_x64
          SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe
        run: |
          bash scripts/fetch-verified.sh \
            "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_${PLATFORM}.tar.gz" \
            "$SHA256" betterleaks "$RUNNER_TEMP"
          set -o pipefail
          scan=("$RUNNER_TEMP/betterleaks" --config .betterleaks.toml --redact --verbose --no-banner)
          status=0
          "${scan[@]}" git . --log-opts="--diff-merges=first-parent HEAD" || status=1
          git log --format='commit %H%n%B' HEAD | "${scan[@]}" stdin || status=1
          exit "$status"
