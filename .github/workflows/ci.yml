name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Lint, type check, test, build and the server bundle, which fails if it
      # holds development tools or leaves a package for run time
      # (scripts/build-server.mjs).
      - name: Check
        run: npm run check
