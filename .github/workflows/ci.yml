name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Spelling in every file git does not ignore, by _typos.toml (#127).
      # The action's SHA pins the typos version: it downloads the release it
      # was tagged with.
      - name: Spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

      # Hadolint on the Dockerfile (#127), the image pinned by the digest of
      # its multi-arch index. Dependabot does not read images in run steps:
      # move the tag and digest by hand. The Dockerfile goes in on stdin and
      # nothing is mounted, so a .hadolint.yaml in the repo would be ignored.
      - name: Dockerfile lint
        run: docker run --rm -i ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same command the pre-commit hook runs (check in package.json).
      - name: Check
        run: npm run check
