name: Server release

# Publishes the HTTP server image for a server-v* tag (ADR-0001 §13):
# server-vX.Y.Z or server-vX.Y.Z-rc.N. The npm package has its own line
# (release.yml, v* releases).

on:
  push:
    tags: ["server-v*"]

# Each job asks for what it needs.
permissions: {}

# A second run for the same tag waits: a running release is not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rededis/dataverse-mcp-server-http

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub Release
      packages: write # GHCR

    steps:
      # Actions are pinned by full commit SHA, the tag in a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Tag ${TAG} is not server-vX.Y.Z or server-vX.Y.Z-rc.N"
            exit 1
          fi
          VERSION="${TAG#server-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The Release is the run's last step: if it exists, the image was
      # published, and a re-run would push it again under the same tags.
      - name: Not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::${GITHUB_REF_NAME} is already released; tag a new version instead"
            exit 1
          fi

      # A release needs its own section; a pre-release may still be
      # Unreleased. The section becomes the Release notes.
      - name: Server CHANGELOG has this version
        env:
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Headings only at the start of a line: the file's preamble quotes them.
          has() {
            awk -v h="## [$1]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG-server.md
          }
          section() {
            awk -v h="## [$1]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG-server.md
          }
          if has "$CORE_VERSION"; then
            section "$CORE_VERSION" > release-notes.md
          elif [ "$PRERELEASE" = true ] && has Unreleased; then
            section Unreleased > release-notes.md
          else
            echo "::error::CHANGELOG-server.md is missing a '## [${CORE_VERSION}]' section"
            exit 1
          fi
          if ! grep -v '^[[:space:]]*#' release-notes.md | grep -q '[^[:space:]]'; then
            echo "::error::The CHANGELOG-server.md section for ${CORE_VERSION} is empty"
            exit 1
          fi

      # No npm cache: a poisoned cache entry would end up in what is published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The image's bundle is built from the lockfile (npm ci, then esbuild).
      # The audit sees the lockfile's production packages, dotenv too, though
      # the bundle leaves it out. It does not see what the SDK inlines into
      # its own dist/ (Ajv and others, listed in the image's licenses/); the
      # step after npm ci audits those. audit.yml's schedule covers only
      # the default branch; this stops a tag before anything is installed
      # or built. An unreachable registry fails the step too.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm ci --no-audit --no-fund

      # The same gate for the packages the lockfile does not list (#130).
      # It needs them installed, to bundle; the image is built after it.
      - name: Audit packages inlined by the MCP SDK
        run: node scripts/audit-inlined.mjs

      # The image's esbuild bundle does not type-check; tsc in the check does.
      # The check's own server bundle is a gate only: the image build below
      # bundles again with SERVER_VERSION.
      - name: Check
        run: npm run check

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # X.Y.Z, X.Y and latest for a release; only X.Y.Z-rc.N for a pre-release.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},match=^server-v(.*)$
            type=semver,pattern={{major}}.{{minor}},match=^server-v(.*)$
          labels: |
            org.opencontainers.image.description=MCP server for Microsoft Dataverse over Streamable HTTP
          annotations: |
            org.opencontainers.image.description=MCP server for Microsoft Dataverse over Streamable HTTP
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # The image runs before anything is pushed: it must start and report the
      # tag's version. Only the runner's platform (amd64) is started; the
      # arm64 image holds the same bundle.
      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: server-release-check
          build-args: SERVER_VERSION=${{ steps.version.outputs.version }}
          provenance: false

      - name: The image starts and reports the tag's version
        uses: ./.github/actions/check-image
        with:
          image: server-release-check
          version: ${{ steps.version.outputs.version }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: SERVER_VERSION=${{ steps.version.outputs.version }}
          # Provenance comes from the attestation (#104); BuildKit's own adds
          # unknown/unknown entries to the index.
          provenance: false

      # Not marked latest: the repo's releases page stays on the npm package.
      # A Release made with GITHUB_TOKEN starts no other workflow, so
      # release.yml does not run for it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --latest=false --notes-file release-notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Server ${VERSION}" "${flags[@]}"
