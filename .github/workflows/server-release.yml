name: Server release

# Publishes the HTTP server image for a server-v* tag (ADR-0001 §13):
# server-vX.Y.Z or server-vX.Y.Z-rc.N. The npm package has its own line
# (release.yml, v* releases).

on:
  push:
    tags: ["server-v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rededis/dataverse-mcp-server-http

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub Release
      packages: write # GHCR

    steps:
      # Actions are pinned by full commit SHA, the tag in a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Tag ${TAG} is not server-vX.Y.Z or server-vX.Y.Z-rc.N"
            exit 1
          fi
          VERSION="${TAG#server-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The Release is the run's last step: if it exists, the image was
      # published, and a re-run would push it again under the same tags.
      - name: Not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::${GITHUB_REF_NAME} is already released; tag a new version instead"
            exit 1
          fi

      # A release needs its own section; a pre-release may still be
      # Unreleased. The section becomes the Release notes.
      - name: Server CHANGELOG has this version
        env:
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Headings only at the start of a line: the file's preamble quotes them.
          has() {
            awk -v h="## [$1]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG-server.md
          }
          section() {
            awk -v h="## [$1]" 'index($0, h) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG-server.md
          }
          if has "$CORE_VERSION"; then
            section "$CORE_VERSION" > release-notes.md
          elif [ "$PRERELEASE" = true ] && has Unreleased; then
            section Unreleased > release-notes.md
          else
            echo "::error::CHANGELOG-server.md is missing a '## [${CORE_VERSION}]' section"
            exit 1
          fi
          if ! grep -v '^[[:space:]]*#' release-notes.md | grep -q '[^[:space:]]'; then
            echo "::error::The CHANGELOG-server.md section for ${CORE_VERSION} is empty"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The image's esbuild bundle does not type-check; tsc does.
      - name: Build
        run: npm run build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # X.Y.Z, X.Y and latest for a release; only X.Y.Z-rc.N for a pre-release.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},match=^server-v(.*)$
            type=semver,pattern={{major}}.{{minor}},match=^server-v(.*)$
          labels: |
            org.opencontainers.image.description=MCP server for Microsoft Dataverse over Streamable HTTP
          annotations: |
            org.opencontainers.image.description=MCP server for Microsoft Dataverse over Streamable HTTP
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # The image runs before anything is pushed: it must start and report the
      # tag's version. Only the runner's platform (amd64) is started; the
      # arm64 image holds the same bundle.
      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: server-release-check
          build-args: SERVER_VERSION=${{ steps.version.outputs.version }}
          provenance: false

      # Placeholder settings: the server reads them but calls Dataverse only
      # when a tool is used.
      - name: The image starts and reports the tag's version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '{"roles":{"r":{"groups":["data-read"]}},"tokens":[{"name":"check","sha256":"%064d","role":"r"}]}' 0 > check-config.json
          chmod 644 check-config.json
          docker run -d --name check -p 127.0.0.1:3000:3000 \
            -e DATAVERSE_TENANT_ID=check -e DATAVERSE_CLIENT_ID=check \
            -e DATAVERSE_CLIENT_SECRET=check -e DATAVERSE_RESOURCE_URL=https://check.invalid \
            -e DATAVERSE_SERVER_CONFIG=/config/server.json \
            -v "$PWD/check-config.json:/config/server.json:ro" \
            server-release-check
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 1
          done
          docker logs check
          curl -sf http://127.0.0.1:3000/health
          docker logs check 2>&1 | grep -Fq "Dataverse MCP server ${VERSION} listening" ||
            { echo "::error::The image does not report ${VERSION}"; exit 1; }
          docker rm -f check

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: SERVER_VERSION=${{ steps.version.outputs.version }}
          # Provenance comes from the attestation (#104); BuildKit's own adds
          # unknown/unknown entries to the index.
          provenance: false

      # Not marked latest: the repo's releases page stays on the npm package.
      # A Release made with GITHUB_TOKEN starts no other workflow, so
      # release.yml does not run for it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --latest=false --notes-file release-notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Server ${VERSION}" "${flags[@]}"
