name: Check the server image
description: >-
  Starts a locally loaded server image with placeholder settings, waits for
  /health and checks that the startup line reports the expected version.
  Used by server-release.yml before publishing and by image.yml on pull
  requests.

inputs:
  image:
    description: The local image to start (built with load true)
    required: true
  version:
    description: The SERVER_VERSION the image was built with
    required: true

runs:
  using: composite
  steps:
    # Placeholder settings: the server reads them but calls Dataverse only
    # when a tool is used, so no secrets are needed.
    - name: The image starts and reports its version
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
      run: |
        printf '{"roles":{"r":{"groups":["data-read"]}},"tokens":[{"name":"check","sha256":"%064d","role":"r"}]}' 0 > "$RUNNER_TEMP/check-config.json"
        chmod 644 "$RUNNER_TEMP/check-config.json"
        docker run -d --name check -p 127.0.0.1:3000:3000 \
          -e DATAVERSE_TENANT_ID=check -e DATAVERSE_CLIENT_ID=check \
          -e DATAVERSE_CLIENT_SECRET=check -e DATAVERSE_RESOURCE_URL=https://check.invalid \
          -e DATAVERSE_SERVER_CONFIG=/config/server.json \
          -v "$RUNNER_TEMP/check-config.json:/config/server.json:ro" \
          "$IMAGE"
        for _ in $(seq 30); do
          curl -sf http://127.0.0.1:3000/health >/dev/null && break
          sleep 1
        done
        docker logs check
        curl -sf http://127.0.0.1:3000/health
        docker logs check 2>&1 | grep -Fq "Dataverse MCP server ${VERSION} listening" ||
          { echo "::error::The image does not report ${VERSION}"; exit 1; }
        docker rm -f check
