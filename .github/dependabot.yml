# Moves the pinned versions (#103): base image digests in the Dockerfile,
# action SHAs in the workflows, npm packages in package-lock.json.
# Monthly and grouped, so a run opens a few PRs. The cooldown holds a new
# release back for a week, which limits exposure to compromised releases.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # The typings follow the Node the code runs on (24): a newer major would
    # let the type check pass on APIs Node 24 lacks. They move with Node, by
    # hand (see the docker entry below).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # @vitest/coverage-v8 requires the exact Vitest as a peer: bumped apart,
      # npm ci fails with ERESOLVE. Listed by name, not as @vitest/*: a
      # wildcard loses to the development group below, and coverage-v8 would
      # land there.
      vitest:
        patterns:
          - vitest
          - "@vitest/coverage-v8"
      # The SDK's server and client packages each require one exact version
      # of its core package: bumped apart, the tree gets two copies of it.
      # server and node are production dependencies, client a development one.
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/client"
          - "@modelcontextprotocol/node"
          - "@modelcontextprotocol/server"
      # The groups below have no patterns, so each would also claim the
      # packages named above: exclude them, and keep the lists in sync.
      production:
        dependency-type: production
        exclude-patterns:
          - "@modelcontextprotocol/node"
          - "@modelcontextprotocol/server"
      development:
        dependency-type: development
        exclude-patterns:
          - vitest
          - "@vitest/coverage-v8"
          - "@modelcontextprotocol/client"

  # Both base images in the Dockerfile. A Node major arrives only for the
  # build stage: the runtime image carries the major in its name
  # (nodejs24-debian13), which Dependabot does not change. Such a PR is a
  # prompt to move by hand, together: both FROM stages, node-version in
  # ci.yml, release.yml and server-release.yml, the esbuild target in
  # scripts/build-server.mjs and the @types/node major (ignored in the npm
  # entry above). engines in package.json is the npm package's floor and need
  # not move (audit.yml reads it and already gets the newest Node).
  # The cooldown does not hold back the distroless digest: Dependabot has a
  # publish date only for Docker Hub images, not for gcr.io.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # Updates the SHA and the "# vX.Y.Z" comment after it. Every action the
  # workflows use, by name: a new one outside this list still gets updates,
  # in a PR of its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - actions/checkout
          - actions/setup-node
          - docker/build-push-action
          - docker/login-action
          - docker/metadata-action
          - docker/setup-buildx-action
